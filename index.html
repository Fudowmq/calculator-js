<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="info">
                <div class="show-result"></div>
                <div class="message">0</div>
            </div>
    
        <div class="main-buttons">
            <button class="button clear">C</button>
            <button class="button button-plus">+</button>
            <button class="button button-minus">-</button>
            <button class="button button-multiplication">×</button>
            <button class="button seven">7</button>
            <button class="button eight">8</button>
            <button class="button nine">9</button>
            <button class="button button-division">÷</button>
            <button class="button four">4</button>
            <button class="button five">5</button>
            <button class="button six">6</button>
            <button class="button procent">%</button>
            <button class="button one">1</button>
            <button class="button two">2</button>
            <button class="button three">3</button>
            <button class="button comma">,</button>
            <button class="button zero">0</button>
            <button class="button calculate">=</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
